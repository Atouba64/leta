# Static site — Netlify site: leta-tech → https://leta.repair (Starter / free).
# Publish /website so / serves index.html. Do not create a second Netlify site for this repo.
#
# Netlify UI (Site configuration → Build & deploy):
#   Build command:   (leave empty)
#   Publish directory: website   OR leave blank and rely on this file
#   Base directory:  (must be empty — do NOT set to "website")
[build]
  publish = "website"
  command = "node scripts/sync-partner-tracker.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
