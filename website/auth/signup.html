<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Leta Technologies</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <!-- Animated Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="auth-container">
    <div class="auth-header">
      <img src="../logo-icon.svg" alt="Leta Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%232563eb%22><path d=%22M12 2L2 22h20L12 2z%22/></svg>'">
      <h1>Create an Account</h1>
      <p>Join the Leta network today</p>
    </div>

    <div id="auth-error"></div>
    <div id="auth-success"></div>

    <form class="auth-form" id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Jane Doe" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="new-password" />
        <div class="password-strength">
          <div id="strength-bar" class="password-strength-bar"></div>
        </div>
      </div>

      <button type="submit" class="btn">Sign Up</button>
    </form>

    <div class="auth-toggle">
      <span>Already have an account?</span> 
      <a href="signin.html">Sign in instead</a>
    </div>
  </div>

  <script type="module">
    import { handleSignUp, setupPasswordStrength } from './auth-ui.js';
    
    setupPasswordStrength('password', 'strength-bar');

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      handleSignUp(email, pass, name);
    });
  </script>
</body>
</html>
