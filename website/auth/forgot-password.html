<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Leta Technologies</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <!-- Animated Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="auth-container">
    <div class="auth-header">
      <img src="../logo-icon.svg" alt="Leta Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%232563eb%22><path d=%22M12 2L2 22h20L12 2z%22/></svg>'">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a reset link</p>
    </div>

    <div id="auth-error"></div>
    <div id="auth-success"></div>

    <form class="auth-form" id="reset-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>

      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <div class="auth-toggle">
      <span>Remember your password?</span> 
      <a href="signin.html">Back to Sign In</a>
    </div>
  </div>

  <script type="module">
    import { handlePasswordReset } from './auth-ui.js';
    
    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      handlePasswordReset(email);
    });
  </script>
</body>
</html>
