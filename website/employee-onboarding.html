<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leta Employee Onboarding</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      background: var(--bg-elevated);
      padding: 24px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: var(--bg-elevated);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    #error-msg, #success-msg {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    #error-msg { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    #success-msg { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

  <header class="header">
    <img src="logo-icon.svg" alt="Leta Logo" width="40" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%232563eb%22><path d=%22M12 2L2 22h20L12 2z%22/></svg>'">
    <h1>Employee Onboarding</h1>
  </header>

  <div class="container">
    <div id="error-msg"></div>
    <div id="success-msg">Onboarding complete! Redirecting to Dashboard...</div>

    <form id="onboard-form" style="display: none;">
      <p style="color: var(--text-soft); margin-bottom: 24px;">Welcome to Leta! Please complete your employee profile to get access to the internal dashboard.</p>
      
      <div class="form-group">
        <label for="emp-name">Full Name</label>
        <input type="text" id="emp-name" required placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="emp-role">Role</label>
        <select id="emp-role" required>
          <option value="" disabled selected>Select your role...</option>
          <option value="employee">Internal Employee</option>
          <option value="support">Support Agent</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label for="emp-dept">Department</label>
        <select id="emp-dept" required>
          <option value="" disabled selected>Select your department...</option>
          <option value="engineering">Engineering</option>
          <option value="operations">Operations</option>
          <option value="customer_success">Customer Success</option>
          <option value="management">Management</option>
        </select>
      </div>

      <button type="submit" class="btn" id="submit-btn">Complete Onboarding</button>
    </form>
    
    <div id="auth-warning" style="text-align: center; color: var(--text-soft);">
      <p>Please sign in to complete onboarding.</p>
      <a href="auth.html" style="color: var(--accent); font-weight: 600;">Go to Sign In</a>
    </div>
  </div>

  <script src="contact-config.js"></script>
  <script type="module" src="employee-onboarding.js"></script>
</body>
</html>
